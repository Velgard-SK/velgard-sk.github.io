width=\"1.2\"><\u002Fpath><\u002Fsvg><\u002Fbutton><div class=\"dd-m\"><a href=\"#team\">Team<\u002Fa><a href=\"#contact\">Contact<\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center\">\n<button class=\"toggle\" id=\"toggle\" type=\"button\" aria-label=\"Menu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fnav>\n\n<header class=\"hero\" id=\"top\">\n<div class=\"scanline\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"wrap hero-in\">\n<div>\n<div class=\"label\">Managed continuous pentesting<\u002Fdiv>\n<h1>Security that<span>grows with you.<\u002Fspan><\u002Fh1>\n<p>Validate · Fix · Retest · Evidence<\u002Fp>\n<p class=\"sub\">As your company grows, so does your attack surface. Velgard keeps testing it alongside you — you fix, we verify, and your security gets stronger with every cycle.<\u002Fp>\n<div class=\"acts\">\n<a href=\"#partners\" class=\"btn btn-p\">Become a design partner<svg viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7h8m-3-4 4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"#how\" class=\"btn btn-s\">See how it works<\u002Fa>\n<\u002Fdiv>\n<div class=\"eu\">\n<span class=\"m\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><g fill=\"#00C8D4\"><circle cx=\"8\" cy=\"2\" r=\"1\"><\u002Fcircle><circle cx=\"11\" cy=\"2.8\" r=\"1\"><\u002Fcircle><circle cx=\"13.2\" cy=\"5\" r=\"1\"><\u002Fcircle><circle cx=\"14\" cy=\"8\" r=\"1\"><\u002Fcircle><circle cx=\"13.2\" cy=\"11\" r=\"1\"><\u002Fcircle><circle cx=\"11\" cy=\"13.2\" r=\"1\"><\u002Fcircle><\u002Fg><g fill=\"#2BD18E\"><circle cx=\"8\" cy=\"14\" r=\"1\"><\u002Fcircle><circle cx=\"5\" cy=\"13.2\" r=\"1\"><\u002Fcircle><circle cx=\"2.8\" cy=\"11\" r=\"1\"><\u002Fcircle><circle cx=\"2\" cy=\"8\" r=\"1\"><\u002Fcircle><circle cx=\"2.8\" cy=\"5\" r=\"1\"><\u002Fcircle><circle cx=\"5\" cy=\"2.8\" r=\"1\"><\u002Fcircle><\u002Fg><\u002Fsvg>Built in the EU<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"proof\" aria-label=\"Example evidence record\">\n<div class=\"pr-top\"><span>EVIDENCE RECORD · VG-0142<\u002Fspan><span class=\"pr-live\">LIVE<\u002Fspan><\u002Fdiv>\n<div class=\"pr-asset\"><div class=\"k\">Asset<\u002Fdiv><div class=\"v\">vpn.example.eu<\u002Fdiv><div class=\"pr-finding\">Unpatched remote-access gateway<\u002Fdiv><\u002Fdiv>\n<ol class=\"pr-steps\" id=\"prSteps\">\n<li><span class=\"dot\"><\u002Fspan><span class=\"t\">Detected<\u002Fspan><span class=\"ts\">09:12<\u002Fspan><\u002Fli>\n<li><span class=\"dot\"><\u002Fspan><span class=\"t\">Validated safely<\u002Fspan><span class=\"ts\">09:21<\u002Fspan><\u002Fli>\n<li><span class=\"dot\"><\u002Fspan><span class=\"t\">Fix validated<\u002Fspan><span class=\"ts\">10:04<\u002Fspan><\u002Fli>\n<li><span class=\"dot\"><\u002Fspan><span class=\"t\">Retested<\u002Fspan><span class=\"ts\">Day 2<\u002Fspan><\u002Fli>\n<\u002Fol>\n<div class=\"stamp\" id=\"stamp\"><svg viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M3 8.5 6.5 12 13 4.5\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>Proven fixed<\u002Fdiv>\n<div class=\"pr-foot\"><span>Scope · actions · timestamps · result<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wrap trust\">\n<span>Fewer, confirmed findings<\u002Fspan><span>Every fix retested<\u002Fspan><span>Evidence to support your audit<\u002Fspan><span>Safe by design<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"problem\">\n<div class=\"wrap\">\n<div class=\"lh\">\n<div><div class=\"label\">Why Velgard<\u002Fdiv><h2>A list is not<br><em>an answer.<\u002Fem><\u002Fh2><\u002Fdiv>\n<p>Your scanner gives you hundreds of findings. Your yearly test gives you a PDF. Neither tells you what is really at risk today — or proves last week's fix worked. Velgard does. It doesn't replace your pentest; it covers the months between tests.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ba\">\n<div class=\"panel\">\n<div class=\"ph\"><b>Without Velgard<\u002Fb><span>Scanner report<\u002Fspan><\u002Fdiv>\n<ul class=\"rows\"><li><span>Outdated TLS configuration<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>Missing security header<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Server version disclosed<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Weak cipher suite offered<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>Cookie without secure flag<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Admin login page reachable<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>Directory listing enabled<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Unpatched VPN gateway<\u002Fspan><span class=\"chip\">High<\u002Fspan><\u002Fli><li><span>Self-signed certificate<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Open port 8443<\u002Fspan><span class=\"chip\">Info<\u002Fspan><\u002Fli><li><span>Deprecated JS library<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>DNS record misconfigured<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Outdated TLS configuration<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>Missing security header<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Server version disclosed<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Weak cipher suite offered<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>Cookie without secure flag<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Admin login page reachable<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>Directory listing enabled<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Unpatched VPN gateway<\u002Fspan><span class=\"chip\">High<\u002Fspan><\u002Fli><li><span>Self-signed certificate<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><li><span>Open port 8443<\u002Fspan><span class=\"chip\">Info<\u002Fspan><\u002Fli><li><span>Deprecated JS library<\u002Fspan><span class=\"chip\">Medium<\u002Fspan><\u002Fli><li><span>DNS record misconfigured<\u002Fspan><span class=\"chip\">Low<\u002Fspan><\u002Fli><\u002Ful>\n<div class=\"pf\"><span>Generic scores. No context.<\u002Fspan><b>214 open<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"mid\"><svg viewBox=\"0 0 28 28\" fill=\"none\"><path d=\"M5 14h18M17 8l6 6-6 6\" stroke=\"#00C8D4\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"panel v\">\n<div class=\"ph\"><b>With Velgard<\u002Fb><span>What really matters<\u002Fspan><\u002Fdiv>\n<ul class=\"rows\">\n<li><div>Unpatched VPN gateway<small>Confirmed reachable · owner: IT infra<\u002Fsmall><\u002Fdiv><span class=\"st-c st-high\" id=\"vpnSt\">Confirmed<\u002Fspan><\u002Fli>\n<li><div>Admin login reachable from internet<small>Confirmed · access should be restricted<\u002Fsmall><\u002Fdiv><span class=\"st-c st-high\">Confirmed<\u002Fspan><\u002Fli>\n<li><div>212 other findings<small>Checked · not a real risk in your setup<\u002Fsmall><\u002Fdiv><span class=\"st-c st-mute\">Deprioritised<\u002Fspan><\u002Fli>\n<\u002Ful>\n<div class=\"pf\"><span>Every step recorded as evidence<\u002Fspan><b>2 to act on<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pains\">\n<div class=\"pain\"><span class=\"n\">01 — Point in time<\u002Fspan><h3>Your yearly test expires fast.<\u002Fh3><p>New releases, domains and cloud services appear weekly. Nobody re-checks them until next year.<\u002Fp><\u002Fdiv>\n<div class=\"pain\"><span class=\"n\">02 — Noise<\u002Fspan><h3>Hundreds of findings, no priority.<\u002Fh3><p>Small teams can't tell which matter, so the important ones wait.<\u002Fp><\u002Fdiv>\n<div class=\"pain\"><span class=\"n\">03 — Proof<\u002Fspan><h3>\"Closed\" doesn't mean fixed.<\u002Fh3><p>Auditors and customers want evidence. Today it's rebuilt by hand from tickets and emails.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" class=\"alt\">\n<div class=\"wrap\">\n<div class=\"sh\"><div class=\"label\">How it works<\u002Fdiv><h2>Validate. Fix. <em>Retest.<\u002Fem><\u002Fh2><p>A repeating cycle, not a once-a-year report.<\u002Fp><\u002Fdiv>\n<div class=\"steps\" id=\"steps\">\n<div class=\"track\"><i class=\"fill\" id=\"fill\"><\u002Fi><i class=\"pulse\" id=\"pulse\"><\u002Fi><\u002Fdiv>\n<div class=\"st\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"6\" stroke=\"#00C8D4\"><\u002Fcircle><path d=\"M20 20l-4.3-4.3\" stroke=\"#00C8D4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Detect<\u002Fh3><p>New or changed exposure<\u002Fp><\u002Fdiv>\n<div class=\"st\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3v6M12 21v-6M4 12h6M14 12h6\" stroke=\"#00C8D4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Hypothesis<\u002Fh3><p>What might be at risk<\u002Fp><\u002Fdiv>\n<div class=\"st\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12 9.5 17.5 20 6\" stroke=\"#00C8D4\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Validate<\u002Fh3><p>Safely confirmed, not guessed<\u002Fp><\u002Fdiv>\n<div class=\"st\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12h16M14 6l6 6-6 6\" stroke=\"#00C8D4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Fix<\u002Fh3><p>Sent to an owner<\u002Fp><\u002Fdiv>\n<div class=\"st\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\" stroke=\"#00C8D4\"><\u002Frect><path d=\"M8 12h8\" stroke=\"#00C8D4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h3>Evidence<\u002Fh3><p>Retested and recorded<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"console\">\n<div class=\"top\"><span>VG-0142 · portal.example.eu<\u002Fspan><span class=\"live\">LIVE<\u002Fspan><\u002Fdiv>\n<div class=\"body\"><span class=\"p\" id=\"cStep\">DETECT<\u002Fspan><span class=\"ctw\"><span class=\"gh\">New service version found on portal.example.eu_<\u002Fspan><span class=\"gh\">Known weakness likely present · confidence: high_<\u002Fspan><span class=\"gh\">Read-only check inside scope · confirmed_<\u002Fspan><span class=\"gh\">Assigned to IT infrastructure · owner notified_<\u002Fspan><span class=\"gh\">Retest passed · proof stored in audit trail_<\u002Fspan><span id=\"cText\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"bar2\"><i id=\"cBar\"><\u002Fi><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"again\"><svg viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M12 7a5 5 0 1 1-1.5-3.5M12 2v2.5H9.5\" stroke=\"#00C8D4\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>Then the cycle repeats — with every change<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"safety\">\n<div class=\"wrap\">\n<div class=\"lh\">\n<div><div class=\"label\">Safe by design<\u002Fdiv><h2>You stay<br><em>in control.<\u002Fem><\u002Fh2><\u002Fdiv>\n<p>Velgard works on your live systems, so safety isn't a feature — it's the foundation. In plain terms:<\u002Fp>\n<\u002Fdiv>\n<div class=\"safe\">\n<div class=\"diagram\" id=\"diagram\">\n<svg viewBox=\"0 0 440 300\" aria-label=\"Scope diagram\">\n<rect x=\"20\" y=\"30\" width=\"270\" height=\"240\" rx=\"14\" fill=\"rgba(0,200,212,.04)\" stroke=\"#00C8D4\" stroke-dasharray=\"5 5\"><\u002Frect>\n<text x=\"36\" y=\"22\" fill=\"#00C8D4\">YOUR APPROVED SCOPE<\u002Ftext>\n<g fill=\"#18243A\" stroke=\"rgba(255,255,255,.14)\">\n<rect x=\"50\" y=\"64\" width=\"64\" height=\"40\" rx=\"6\"><\u002Frect><rect x=\"190\" y=\"64\" width=\"64\" height=\"40\" rx=\"6\"><\u002Frect>\n<rect x=\"50\" y=\"196\" width=\"64\" height=\"40\" rx=\"6\"><\u002Frect><rect x=\"190\" y=\"196\" width=\"64\" height=\"40\" rx=\"6\"><\u002Frect>\n<\u002Fg>\n<g fill=\"#9AA0B0\"><text x=\"62\" y=\"88\">WEB<\u002Ftext><text x=\"206\" y=\"88\">API<\u002Ftext><text x=\"62\" y=\"220\">MAIL<\u002Ftext><text x=\"200\" y=\"220\">PORTAL<\u002Ftext><\u002Fg>\n<g class=\"scan\">\n<circle r=\"5\" fill=\"#00C8D4\"><animateMotion dur=\"6s\" repeatCount=\"indefinite\" path=\"M82 84 L222 84 L222 216 L82 216 Z\"><\u002FanimateMotion><\u002Fcircle>\n<circle cx=\"155\" cy=\"150\" r=\"16\" fill=\"#0B1220\" stroke=\"#00C8D4\"><\u002Fcircle>\n<path d=\"M147 144 L155 158 L163 144\" stroke=\"#00C8D4\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath>\n<\u002Fg>\n<g fill=\"#111B2E\" stroke=\"rgba(255,255,255,.08)\" stroke-dasharray=\"3 3\"><rect x=\"340\" y=\"64\" width=\"80\" height=\"40\" rx=\"6\"><\u002Frect><rect x=\"340\" y=\"196\" width=\"80\" height=\"40\" rx=\"6\"><\u002Frect><\u002Fg>\n<g fill=\"#5A6070\"><text x=\"352\" y=\"82\">SHARED<\u002Ftext><text x=\"352\" y=\"95\">HOSTING<\u002Ftext><text x=\"352\" y=\"214\">OTHER<\u002Ftext><text x=\"352\" y=\"227\">COMPANY<\u002Ftext><\u002Fg>\n<text x=\"330\" y=\"150\" fill=\"#5A6070\">NOT YOURS<\u002Ftext>\n<g class=\"scan\"><path d=\"M170 150 L290 150\" stroke=\"#00C8D4\" stroke-width=\"1\" stroke-dasharray=\"3 4\"><animate attributeName=\"stroke-dashoffset\" from=\"0\" to=\"-14\" dur=\"1s\" repeatCount=\"indefinite\"><\u002Fanimate><\u002Fpath><\u002Fg>\n<g stroke=\"#E24B4A\" stroke-width=\"1.8\"><path d=\"M283 143 L297 157 M297 143 L283 157\"><\u002Fpath><\u002Fg>\n<text x=\"300\" y=\"175\" fill=\"#E24B4A\">BLOCKED<\u002Ftext>\n<\u002Fsvg>\n<div class=\"kill\"><span id=\"killLbl\">Running · click to stop everything<\u002Fspan><span class=\"sw\" id=\"sw\" role=\"switch\" aria-checked=\"true\" tabindex=\"0\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div class=\"promises\">\n<div class=\"pr\"><div class=\"ic\"><svg viewBox=\"0 0 20 20\" fill=\"none\"><rect x=\"3\" y=\"3\" width=\"14\" height=\"14\" rx=\"3\" stroke=\"#00C8D4\" stroke-dasharray=\"3 2\"><\u002Frect><\u002Fsvg><\u002Fdiv><div><h3>We only check what you approve.<\u002Fh3><p>You define the scope. Anything outside it is blocked automatically.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"pr\"><div class=\"ic\"><svg viewBox=\"0 0 20 20\" fill=\"none\"><path d=\"M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z\" stroke=\"#00C8D4\"><\u002Fpath><circle cx=\"10\" cy=\"10\" r=\"2.2\" stroke=\"#00C8D4\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><h3>We look — we don't break.<\u002Fh3><p>Checks are gentle and read-only by default, so production keeps running.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"pr\"><div class=\"ic\"><svg viewBox=\"0 0 20 20\" fill=\"none\"><circle cx=\"10\" cy=\"7\" r=\"3\" stroke=\"#00C8D4\"><\u002Fcircle><path d=\"M4 17c1-3 3.5-4.5 6-4.5s5 1.5 6 4.5\" stroke=\"#00C8D4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><h3>Bigger steps need your yes.<\u002Fh3><p>Anything beyond a light check waits for approval from a named person on your team.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"pr\"><div class=\"ic\"><svg viewBox=\"0 0 20 20\" fill=\"none\"><circle cx=\"10\" cy=\"10\" r=\"7\" stroke=\"#00C8D4\"><\u002Fcircle><path d=\"M10 5v5\" stroke=\"#00C8D4\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><h3>Stop it anytime. See everything.<\u002Fh3><p>One switch pauses all activity. Every action is logged — who, what, why and when.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"motto\">AI suggests. <b>Your rules decide.<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"who\" class=\"alt urg\">\n<div class=\"wrap\" style=\"position:relative\">\n<div class=\"lh\">\n<div><div class=\"label\">Who it's for<\u002Fdiv><h2>The rules changed.<br><em>Your team didn't grow.<\u002Fem><\u002Fh2><\u002Fdiv>\n<p>NIS2 and the CRA don't tell you which tool to buy — but they raise the bar for showing that your security measures actually work. The deadlines are here, and management is accountable.<\u002Fp>\n<\u002Fdiv>\n<div class=\"tl\" style=\"--today:52%\">\n<div class=\"line\"><i><\u002Fi><\u002Fdiv>\n<div class=\"today\"><span>TODAY<\u002Fspan><i><\u002Fi><b><\u002Fb><\u002Fdiv>\n<div class=\"pts\">\n<div class=\"pt past\"><span class=\"d\"><\u002Fspan><div class=\"y\">OCT 2024<\u002Fdiv><h4>NIS2 in national law<\u002Fh4><p>Thousands of mid-sized companies now in scope.<\u002Fp><\u002Fdiv>\n<div class=\"pt past\"><span class=\"d\"><\u002Fspan><div class=\"y\">DEC 2024<\u002Fdiv><h4>CRA enters into force<\u002Fh4><p>Security requirements for products with digital elements.<\u002Fp><\u002Fdiv>\n<div class=\"pt past\"><span class=\"d\"><\u002Fspan><div class=\"y\">SEP 2026<\u002Fdiv><h4>CRA reporting starts<\u002Fh4><p>Product makers must report actively used vulnerabilities.<\u002Fp><\u002Fdiv>\n<div class=\"pt\"><span class=\"d\"><\u002Fspan><div class=\"y\">DEC 2027<\u002Fdiv><h4>CRA fully applies<\u002Fh4><p>Security across the whole product lifecycle — with evidence.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pressure\">\n<div class=\"pc\"><div class=\"big\">Management is <em>liable.<\u002Fem><\u002Fdiv><p>Under NIS2, management must approve and oversee security measures — and can be held personally liable.<\u002Fp><\u002Fdiv>\n<div class=\"pc\"><div class=\"big\">Up to <em>€10M<\u002Fem> or 2% of turnover.<\u002Fdiv><p>Maximum NIS2 fines for essential entities. CRA penalties go higher.<\u002Fp><\u002Fdiv>\n<div class=\"pc\"><div class=\"big\">Customers <em>ask first.<\u002Fem><\u002Fdiv><p>Larger customers and insurers want evidence before they sign.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fit\">\n<h3>You're a fit if you're…<\u002Fh3>\n<ul>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Running your own internet-facing apps, APIs or infrastructure<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Without an in-house pentest team — but with someone who owns security risk<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Facing NIS2, the CRA or customer security questions<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>A European SMB, typically up to ~250 people<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pricing\">\n<div class=\"wrap\">\n<div class=\"sh\"><div class=\"label\">Pricing<\u002Fdiv><h2>Simple, <em>predictable<\u002Fem> plans.<\u002Fh2><p>Monthly subscription. Pay yearly and get two months free.<\u002Fp><\u002Fdiv>\n<div class=\"plans\">\n<div class=\"plan\">\n<div><h3>Watcher<\u002Fh3><p class=\"for\">Know what you expose — and what changed.<\u002Fp><\u002Fdiv>\n<div><div class=\"price\"><b>€149<\u002Fb><span>/ month<\u002Fspan><\u002Fdiv><div class=\"yr\">€124 / month billed yearly<\u002Fdiv><\u002Fdiv>\n<ul>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Map of everything visible from the internet<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Alerts when your attack surface changes<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Alerts on actively exploited vulnerabilities in your technology<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Leaked-account check<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Monthly summary for management<\u002Fli>\n<\u002Ful>\n<a href=\"#contact\" class=\"btn btn-s\">Start with Watcher<\u002Fa>\n<\u002Fdiv>\n<div class=\"plan feat\">\n<span class=\"badge\">Recommended<\u002Fspan>\n<div><h3>Guardian<\u002Fh3><p class=\"for\">Know where you're vulnerable — and prove it's fixed.<\u002Fp><\u002Fdiv>\n<div><div class=\"price\"><b>€349<\u002Fb><span>/ month<\u002Fspan><\u002Fdiv><div class=\"yr\">€291 / month billed yearly<\u002Fdiv><\u002Fdiv>\n<ul>\n<li class=\"inc\">Everything in Watcher, plus:<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Active testing within your approved scope<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Safe validation of what really matters<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Retest of every fix<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Executive and technical reports<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Test record to support NIS2 / CRA audits<\u002Fli>\n<\u002Ful>\n<a href=\"#contact\" class=\"btn btn-p\">Choose Guardian<svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 7h8m-3-4 4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<div class=\"plan\">\n<div><h3>Enterprise<\u002Fh3><p class=\"for\">For larger or more complex environments.<\u002Fp><\u002Fdiv>\n<div><div class=\"price\"><b>Custom<\u002Fb><\u002Fdiv><div class=\"yr\">Individual terms<\u002Fdiv><\u002Fdiv>\n<ul>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Large or hybrid attack surfaces<\u002Fli>\n<li><svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2.5 7.5 5.5 10.5 11.5 4\" stroke=\"#2BD18E\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Scope, frequency and add-ons tailored to you<\u002Fli>\n<\u002Ful>\n<a href=\"#contact\" class=\"btn btn-s\">Talk to us<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"pnote\">Prices excl. VAT, for up to 50 exposed services. Larger attack surfaces are priced by size. Add-ons: web application tests, extra retests and validation runs.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"partners\" class=\"alt\">\n<div class=\"wrap pp\">\n<div class=\"pp-l\">\n<div class=\"label\">Design partner program<\u002Fdiv>\n<h2>Shape Velgard<br><em>with us.<\u002Fem><\u002Fh2>\n<p>We're inviting a small group of companies to use Velgard on their real perimeter and help shape what we build next — in return for early access and founding-partner terms.<\u002Fp>\n<div class=\"gg2\">\n<div><h4>You get<\u002Fh4><ul><li>The full service during the pilot, at no cost<\u002Fli><li>Regular results reviews with the founders<\u002Fli><li>A real say in our roadmap<\u002Fli><li>Founding-partner pricing afterwards<\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4>We ask<\u002Fh4><ul><li>Authorisation to test an agreed scope<\u002Fli><li>A contact who owns the fixes<\u002Fli><li>Honest, regular feedback<\u002Fli><li>Optionally, a reference later<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"seats\">Limited places<\u002Fdiv>\n<div class=\"acts\"><a href=\"#contact\" class=\"btn btn-p\">Apply as design partner<svg viewBox=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 7h8m-3-4 4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fdiv>\n<p class=\"pp-more\">Not ready for close collaboration? We also offer early-adopter terms and a partner program for MSPs, MSSPs and consultants — <a href=\"#contact\">just ask<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<ol class=\"journey\">\n<li><span class=\"n\">01<\u002Fspan><div><h3>Intro call<\u002Fh3><p>How you handle findings, fixes and audits today. No demo, no pitch.<\u002Fp><\u002Fdiv><span class=\"dur\">30 MIN<\u002Fspan><\u002Fli>\n<li><span class=\"n\">02<\u002Fspan><div><h3>Scope &amp; authorisation<\u002Fh3><p>We agree what Velgard may test, and an authorised person on your side signs off.<\u002Fp><\u002Fdiv><span class=\"dur\">1 WEEK<\u002Fspan><\u002Fli>\n<li><span class=\"n\">03<\u002Fspan><div><h3>Run the pilot<\u002Fh3><p>Velgard tests your perimeter. We review the results with you regularly.<\u002Fp><\u002Fdiv><span class=\"dur\">PILOT<\u002Fspan><\u002Fli>\n<li><span class=\"n\">04<\u002Fspan><div><h3>Decide<\u002Fh3><p>Continue on founding-partner terms — or walk away. No lock-in.<\u002Fp><\u002Fdiv><span class=\"dur\">DECIDE<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"team\">\n<div class=\"wrap\">\n<div class=\"sh rv\"><div class=\"label\">Team<\u002Fdiv><h2>From regulated <em>industry.<\u002Fem><\u002Fh2><p>Senior practitioners who've built and broken this before.<\u002Fp><\u002Fdiv>\n<div class=\"team rv\">\n<div><div class=\"big\">5<\u002Fdiv><div class=\"big-l\">Senior · 10+ yrs each<\u002Fdiv><\u002Fdiv>\n<div class=\"dom\">\n<span>Product &amp; business<\u002Fspan><span>Industrial security<\u002Fspan><span>Architecture<\u002Fspan><span>Software engineering<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\">\n<div class=\"wrap\">\n<div class=\"sh\"><div class=\"label\">Contact<\u002Fdiv><h2>Get in <em>touch.<\u002Fem><\u002Fh2><\u002Fdiv>\n<div class=\"cgrid\">\n<a class=\"cc\" href=\"mailto:velgard@velgard.eu\"><span class=\"k\">Email<\u002Fspan><span class=\"v\">velgard@velgard.eu<\u002Fspan><\u002Fa>\n<div class=\"cc\"><span class=\"k\">Headquarters<\u002Fspan><span class=\"v\">Košice, Slovakia<\u002Fspan><\u002Fdiv>\n<div class=\"cc\"><span class=\"k\">Region<\u002Fspan><span class=\"v\">European Union<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n<div class=\"wrap foot\">\n<a href=\"#top\" class=\"brand\" style=\"display:flex\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M2 4 L12 22 L22 4\" stroke=\"#00C8D4\" stroke-width=\"1.6\"><\u002Fpath><circle cx=\"12\" cy=\"22\" r=\"1.8\" fill=\"#2BD18E\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n<span>© 2026 VELGARD<\u002Fspan>\n<span>EU-BASED<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<script>\nconst nav=document.getElementById('nav'),tg=document.getElementById('toggle');\ntg.addEventListener('click',()=>{const o=nav.classList.toggle('open');tg.setAttribute('aria-expanded',o)});\ndocument.querySelectorAll('#links a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));\nconst prs=[...document.querySelectorAll('#prSteps li')],stamp=document.getElementById('stamp'),scan=document.querySelector('.scanline');\nconst T=14000,t0=performance.now(),hero=document.getElementById('top');\nfunction sync(now){const p=((now-t0)%T)/T,hr=hero.getBoundingClientRect(),ly=p*hr.height,y=hr.top+ly;\nscan.style.transform='translateY('+ly+'px)';scan.style.opacity=p<.03?p/.03:p>.97?(1-p)/.03:1;\nlet last=0;prs.forEach(l=>{const r=l.querySelector('.dot').getBoundingClientRect(),c=r.top+r.height/2,lt=l.getBoundingClientRect().top+30;l.classList.toggle('on',y>=c);l.style.setProperty('--f',Math.min(1,Math.max(0,(y-lt)/18)));last=c});\nstamp.classList.toggle('on',y>=last+30);\nrequestAnimationFrame(sync)}\nif(matchMedia('(prefers-reduced-motion: reduce)').matches){prs.forEach(l=>{l.classList.add('on');l.style.setProperty('--f',1)});stamp.classList.add('on');scan.style.display='none'}else requestAnimationFrame(sync);\nconst steps=[...document.querySelectorAll('#steps .st')],fill=document.getElementById('fill'),pulse=document.getElementById('pulse');\nconst cS=document.getElementById('cStep'),cT=document.getElementById('cText'),cB=document.getElementById('cBar');\nconst msgs=[['DETECT','New service version found on portal.example.eu'],['HYPOTHESIS','Known weakness likely present · confidence: high'],['VALIDATE','Read-only check inside scope · confirmed'],['FIX','Assigned to IT infrastructure · owner notified'],['EVIDENCE','Retest passed · proof stored in audit trail']];\nlet si=0,tt;\nfunction step(){steps.forEach((s,i)=>{s.classList.toggle('on',i===si);s.classList.toggle('done',i<si)});\nconst p=si/(steps.length-1)*100;fill.style.width=p+'%';pulse.style.left='calc('+p+'% - 3px)';\ncS.textContent=msgs[si][0];clearInterval(tt);const m=msgs[si][1];let k=0;cT.innerHTML='<span class=\"cur\"><\u002Fspan>';\ntt=setInterval(()=>{k++;cT.innerHTML=m.slice(0,k)+'<span class=\"cur\"><\u002Fspan>';if(k>=m.length)clearInterval(tt)},22);\ncB.classList.remove('run');void cB.offsetWidth;cB.classList.add('run');si=(si+1)%steps.length}\nstep();setInterval(step,2400);\nconst vpn=document.getElementById('vpnSt'),vs=[['Confirmed','st-high'],['Fixing','st-fix'],['Retested ✓','st-ok']];let vi=0;\nsetInterval(()=>{vi=(vi+1)%vs.length;vpn.textContent=vs[vi][0];vpn.className='st-c '+vs[vi][1]},2200);\nconst sw=document.getElementById('sw'),dg=document.getElementById('diagram'),kl=document.getElementById('killLbl');\nfunction tog(){const off=sw.classList.toggle('off');dg.classList.toggle('paused',off);sw.setAttribute('aria-checked',!off);kl.textContent=off?'Paused · all activity stopped':'Running · click to stop everything';dg.querySelector('svg').pauseAnimations&&(off?dg.querySelector('svg').pauseAnimations():dg.querySelector('svg').unpauseAnimations())}\nconst jr=document.querySelector('.journey')
